<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kaizen — Trading Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151C; --panel:#1B2028; --panel-glass:rgba(27,32,40,0.72);
    --border:rgba(232,230,224,0.09); --border-strong:rgba(232,230,224,0.18);
    --gold:#C9A24B; --gold-soft:rgba(201,162,75,0.14);
    --profit:#4FAE84; --profit-soft:rgba(79,174,132,0.14);
    --loss:#C1554B; --loss-soft:rgba(193,85,75,0.14);
    --text:#E8E6E0; --text-muted:#9298A5; --text-faint:#5B6170;
    --r-s:10px; --r-m:16px; --r-l:22px;
    --font-display:'Space Grotesk',-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:var(--font-display); -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button,input,select,textarea{font-family:inherit; color:inherit;}
  input,select,textarea{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-s); color:var(--text); padding:11px 13px; font-size:15px; width:100%;}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  input::placeholder,textarea::placeholder{color:var(--text-faint);}
  button{cursor:pointer; background:none; border:none;}
  .mono{font-family:var(--font-mono);}
  a{color:var(--gold);}

  .app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 8px;}
  .brand{display:flex; align-items:baseline; gap:9px;}
  .brand-mark{font-size:20px; color:var(--gold); line-height:1;}
  .brand-name{font-size:19px; font-weight:600; letter-spacing:0.01em;}
  .topbar-actions{display:flex; gap:6px;}
  .icon-btn{width:38px; height:38px; border-radius:var(--r-s); display:flex; align-items:center; justify-content:center; color:var(--text-muted); transition:background .15s, color .15s;}
  .icon-btn:hover{background:var(--panel); color:var(--text);}
  .icon-btn:disabled{opacity:0.35; cursor:not-allowed;}

  .ledger-strip{display:flex; overflow-x:auto; gap:0; margin:10px 18px 4px; padding:14px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); scrollbar-width:none;}
  .ledger-strip::-webkit-scrollbar{display:none;}
  .metric{flex:1 0 auto; min-width:84px; display:flex; flex-direction:column; gap:3px; padding:0 14px; border-right:1px solid var(--border);}
  .metric:last-child{border-right:none;}
  .metric-value{font-family:var(--font-mono); font-size:16px; font-weight:500; white-space:nowrap;}
  .metric-value.up{color:var(--profit);}
  .metric-value.down{color:var(--loss);}
  .metric-label{font-size:11.5px; color:var(--text-muted);}

  .content{flex:1; padding:14px 18px 110px; overflow-y:auto;}
  .toolbar{display:flex; flex-direction:column; gap:9px; margin-bottom:16px;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); pointer-events:none;}
  .search-wrap input{padding-left:37px;}
  .filter-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .filter-row select{font-size:13.5px; padding:9px 10px;}

  .trade-list{display:flex; flex-direction:column; gap:10px;}
  .trade-card{background:var(--panel-glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--border); border-left:3px solid var(--text-faint); border-radius:var(--r-m); overflow:hidden;}
  .trade-card.seam-gold{border-left-color:var(--gold);}
  .trade-card.seam-profit{border-left-color:var(--profit);}
  .trade-card.seam-loss{border-left-color:var(--loss);}
  .trade-card.seam-muted{border-left-color:var(--text-faint); opacity:0.72;}
  .trade-summary{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; text-align:left;}
  .trade-main{display:flex; align-items:center; gap:9px; min-width:0;}
  .trade-pair{font-weight:600; font-size:15.5px; white-space:nowrap;}
  .trade-dir{font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em;}
  .dir-long{background:var(--profit-soft); color:var(--profit);}
  .dir-short{background:var(--loss-soft); color:var(--loss);}
  .trade-side{display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0;}
  .trade-pnl{font-family:var(--font-mono); font-size:14px; font-weight:500;}
  .trade-pnl.up{color:var(--profit);} .trade-pnl.down{color:var(--loss);}
  .trade-meta{font-size:11.5px; color:var(--text-muted);}

  .trade-detail{padding:0 16px 16px; border-top:1px solid var(--border); margin-top:2px; padding-top:14px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px 14px; margin-bottom:12px;}
  .detail-row{display:flex; flex-direction:column; gap:2px; font-size:13px;}
  .detail-row span:first-child{color:var(--text-muted); font-size:11.5px;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .tag{font-size:11.5px; background:var(--panel); border:1px solid var(--border-strong); padding:4px 9px; border-radius:20px; color:var(--text-muted);}
  .tag-warn{color:var(--loss); border-color:rgba(193,85,75,0.3);}
  .detail-notes{font-size:13.5px; color:var(--text); line-height:1.5; margin:0 0 10px; white-space:pre-wrap;}
  .detail-link{font-size:12.5px; display:inline-block; margin-bottom:10px;}
  .detail-actions{display:flex; flex-wrap:wrap; gap:8px;}
  .detail-btn{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:8px 12px; border-radius:20px; background:var(--panel); border:1px solid var(--border-strong); color:var(--text-muted); transition:color .15s, border-color .15s;}
  .detail-btn:hover{color:var(--text); border-color:var(--gold);}
  .detail-btn[data-action="delete"]:hover{color:var(--loss); border-color:var(--loss);}

  .empty-state{padding:60px 20px; text-align:center;}
  .empty-title{font-size:16px; font-weight:600; margin:0 0 6px;}
  .empty-body{font-size:13.5px; color:var(--text-muted); margin:0;}

  .fab{position:fixed; left:50%; bottom:88px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:var(--gold); color:#1B1608; font-weight:600; font-size:14.5px; padding:13px 22px; border-radius:30px; box-shadow:0 8px 24px rgba(201,162,75,0.35); transition:transform .12s;}
  .fab:active{transform:translateX(-50%) scale(0.96);}

  .bottom-nav{position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto; display:flex; background:rgba(18,21,28,0.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--text-faint); font-size:10.5px; transition:color .15s;}
  .nav-item.is-active{color:var(--gold);}
  .nav-item:not(.is-active):active{color:var(--text-muted);}

  .overlay{position:fixed; inset:0; background:rgba(8,9,13,0.6); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fadeIn .15s ease;}
  .sheet{width:100%; max-width:520px; max-height:88vh; overflow-y:auto; background:var(--panel); border-radius:24px 24px 0 0; border-top:1px solid var(--border-strong); padding:20px 20px calc(24px + env(safe-area-inset-bottom)); animation:slideUp .22s cubic-bezier(.22,1,.36,1);}
  .sheet.sheet-small{max-height:none;}
  @keyframes slideUp{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .sheet-title{font-size:18px; font-weight:600; margin:0;}
  .sheet-close{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); background:var(--ink);}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:12.5px; color:var(--text-muted);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field-hint{font-size:11px; color:var(--text-faint); margin-top:-2px;}
  .seg{display:flex; background:var(--ink); border:1px solid var(--border); border-radius:var(--r-s); padding:3px;}
  .seg button{flex:1; padding:9px; border-radius:8px; font-size:13.5px; font-weight:500; color:var(--text-muted);}
  .seg button.active{background:var(--panel); color:var(--text); box-shadow:0 0 0 1px var(--border-strong);}
  .chip-group{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{font-size:12.5px; padding:7px 12px; border-radius:20px; background:var(--ink); border:1px solid var(--border); color:var(--text-muted);}
  .chip.active{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}

  .calc-panel{background:var(--ink); border:1px solid var(--border); border-radius:var(--r-m); padding:14px 16px; margin-bottom:16px;}
  .calc-title{font-size:11.5px; color:var(--gold); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 10px;}
  .calc-row{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:13.5px; border-bottom:1px dashed var(--border);}
  .calc-row:last-child{border-bottom:none;}
  .calc-row span:first-child{color:var(--text-muted);}
  .calc-row span:last-child{font-family:var(--font-mono); font-weight:500;}
  .calc-warn{color:var(--loss); font-size:12px; margin-top:6px;}

  .btn{width:100%; padding:14px; border-radius:var(--r-s); font-weight:600; font-size:15px; text-align:center;}
  .btn-primary{background:var(--gold); color:#1B1608;}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-ghost{background:var(--ink); color:var(--text); border:1px solid var(--border-strong);}
  .btn-danger{background:var(--loss); color:#fff;}
  .btn-row{display:flex; gap:10px; margin-top:4px;}

  .toast-root{position:fixed; top:16px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:100; pointer-events:none;}
  .toast{background:var(--panel); border:1px solid var(--border-strong); color:var(--text); font-size:13.5px; padding:11px 18px; border-radius:30px; box-shadow:0 8px 20px rgba(0,0,0,0.35); animation:toastIn .2s ease;}
  .toast.error{border-color:rgba(193,85,75,0.5); color:#F0B4AF;}
  @keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

  .db-blocked{margin:60px 20px; text-align:center; padding:24px; border:1px solid var(--border-strong); border-radius:var(--r-m); background:var(--panel);}

  .auth-gate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--ink); z-index:200; padding:24px;}
  .auth-card{max-width:360px; width:100%; text-align:center; background:var(--panel); border:1px solid var(--border-strong); border-radius:var(--r-l); padding:36px 28px;}
  .auth-copy{font-size:13.5px; color:var(--text-muted); line-height:1.5; margin:0 0 22px;}
  .auth-status{font-size:12.5px; color:var(--loss); margin:14px 0 0; min-height:16px;}

  @media (prefers-reduced-motion: reduce){
    .sheet,.overlay,.toast,.fab{animation:none !important; transition:none !important;}
  }
  @media (min-width: 560px){
    .filter-row{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; margin-bottom:16px;"><span class="brand-mark">改</span><span class="brand-name">Kaizen</span></div>
    <p class="auth-copy">Private to you and your trading partner. Sign in with the Google account added to Kaizen to continue.</p>
    <button class="btn btn-primary" id="signInBtn">Sign in with Google</button>
    <p class="auth-status" id="authStatus"></p>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">改</span><span class="brand-name">Kaizen</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="importBtn" aria-label="Import trades" title="Import"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V6"/><path d="M6 12l6-6 6 6"/><path d="M4 20h16"/></svg></button>
      <button class="icon-btn" id="exportBtn" aria-label="Export trades" title="Export"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14"/><path d="M6 12l6 6 6-6"/><path d="M4 20h16"/></svg></button>
    </div>
  </header>

  <div class="ledger-strip" id="ledgerStrip"></div>

  <main class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="search" id="searchInput" placeholder="Search pair, strategy, notes…">
      </div>
      <div class="filter-row">
        <select id="filterStatus" aria-label="Filter by status">
          <option value="active">Active</option>
          <option value="open">Open only</option>
          <option value="closed">Closed only</option>
          <option value="archived">Archived</option>
        </select>
        <select id="filterTrader" aria-label="Filter by trader">
          <option value="all">Everyone</option>
        </select>
        <select id="sortBy" aria-label="Sort trades">
          <option value="date_desc">Newest</option>
          <option value="date_asc">Oldest</option>
          <option value="pnl_desc">Best P&amp;L</option>
          <option value="pnl_asc">Worst P&amp;L</option>
        </select>
      </div>
    </div>
    <div id="tradeList" class="trade-list"></div>
  </main>

  <button class="fab" id="newTradeFab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>New trade</span></button>

  <nav class="bottom-nav">
    <button class="nav-item is-active" data-tab="journal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="13" y2="18"/></svg><span>Journal</span></button>
    <button class="nav-item" data-tab="dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></button>
    <button class="nav-item" data-tab="calculator"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="8" y1="6.5" x2="16" y2="6.5"/><circle cx="8.5" cy="11.5" r="1"/><circle cx="12" cy="11.5" r="1"/><circle cx="15.5" cy="11.5" r="1"/><circle cx="8.5" cy="15.5" r="1"/><circle cx="12" cy="15.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/></svg><span>Calculator</span></button>
    <button class="nav-item" data-tab="analytics"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="11"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="21" y1="20" x2="3" y2="20"/></svg><span>Analytics</span></button>
    <button class="nav-item" data-tab="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="14" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="8" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="16" cy="18" r="2"/></svg><span>Settings</span></button>
  </nav>
</div>

<datalist id="traderList"></datalist>
<div id="overlayRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<input type="file" id="importFileInput" accept=".csv,.json" hidden>

    archivei:'<rect x="3" y="4" width="18" height="4" rx="1.2"/><path d="M5 8.5V18a2 2 0 002 2h10a2 2 0 002-2V8.5"/><line x1="10" y1="13" x2="14" y2="13"/>',
    undo:'<path d="M9 14l-4.5-4.5L9 5"/><path d="M4.5 9.5H14a5.5 5.5 0 015.5 5.5v1"/>',
    x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>'
  };
  function icon(name, size){
    size = size || 20;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
  }

  /* ---------------- Constants ---------------- */
  var EMOTIONS = ['Calm','Confident','Anxious','FOMO','Revenge','Bored','Excited'];
  var MISTAKES = ['Moved stop-loss','Oversized position','No clear setup','Revenge trade','FOMO entry','Ignored plan','Chased entry'];
  var SESSIONS = ['Asian','London','New York','London/NY Overlap'];
  var DEFAULT_STARTING_BALANCE = 10000;
  var DEFAULT_PIP_VALUE = 10;
  var DEFAULT_RISK_PERCENT = 1;

  /* ---------------- State ---------------- */
  var trades = [];
  var accountMeta = { startingBalance: DEFAULT_STARTING_BALANCE };
  var dbReady = false;
  var filters = { search:'', status:'active', trader:'all', sort:'date_desc' };

  /* ---------------- Helpers ---------------- */
  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function fmtMoney(n){ n = n||0; var s = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (n<0?'-₹':'₹')+s; }
  function fmtR(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (n>0?'+':'')+n.toFixed(2)+'R'; }
  function fmtPct(n){ return n.toFixed(1)+'%'; }
  function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function getPipSize(pair){ return /jpy/i.test(pair||'') ? 0.01 : 0.0001; }
  function nowLocalInput(){
    var d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }
  function toIso(localVal){ return localVal ? new Date(localVal).toISOString() : new Date().toISOString(); }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }

  /* ---------------- Calculations ---------------- */
  function calcEntry(o){
    var pipSize = getPipSize(o.pair);
    var slPips = (o.entryPrice!=null && o.stopLoss!=null) ? Math.abs(o.entryPrice - o.stopLoss)/pipSize : null;
    var tpPips = (o.entryPrice!=null && o.takeProfit!=null) ? Math.abs(o.takeProfit - o.entryPrice)/pipSize : null;
    var rr = (tpPips!=null && slPips>0) ? tpPips/slPips : null;
    var riskAmount = (o.accountBalance!=null && o.riskPercent!=null) ? o.accountBalance*(o.riskPercent/100) : null;
    var positionSizeLots = (riskAmount!=null && slPips>0 && o.pipValue>0) ? riskAmount/(slPips*o.pipValue) : null;
    return { pipSize:pipSize, slPips:slPips, tpPips:tpPips, rr:rr, riskAmount:riskAmount, positionSizeLots:positionSizeLots };
  }
  function calcClose(trade, exitPrice){
    var pipSize = getPipSize(trade.pair);
    var dir = trade.direction === 'long' ? 1 : -1;
    var pnlPips = ((exitPrice - trade.entryPrice)/pipSize) * dir;
    var pnlAmount = pnlPips * (trade.pipValue||0) * (trade.positionSizeLots||0);
    var pnlR = trade.riskAmount ? pnlAmount/trade.riskAmount : 0;
    var outcome = pnlAmount > 0.005 ? 'win' : pnlAmount < -0.005 ? 'loss' : 'breakeven';
    return { pnlPips:pnlPips, pnlAmount:pnlAmount, pnlR:pnlR, outcome:outcome };
  }
  function computeStats(){
    var active = trades.filter(function(t){ return !t.archived; });
    var closed = active.filter(function(t){ return t.status==='closed'; });
    var open = active.filter(function(t){ return t.status==='open'; });
    var wins = closed.filter(function(t){ return t.outcome==='win'; });
    var losses = closed.filter(function(t){ return t.outcome==='loss'; });
    var decided = wins.length + losses.length;
    var winRate = decided ? (wins.length/decided)*100 : null;
    var avgWinR = wins.length ? wins.reduce(function(s,t){return s+t.pnlR;},0)/wins.length : 0;
    var avgLossR = losses.length ? Math.abs(losses.reduce(function(s,t){return s+t.pnlR;},0)/losses.length) : 0;
    var expectancyR = decided ? ((winRate/100)*avgWinR) - ((1-winRate/100)*avgLossR) : null;
    var grossProfit = wins.reduce(function(s,t){return s+t.pnlAmount;},0);
    var grossLoss = Math.abs(losses.reduce(function(s,t){return s+t.pnlAmount;},0));
    var profitFactor = grossLoss>0 ? grossProfit/grossLoss : (grossProfit>0 ? Infinity : null);
    var totalPnl = closed.reduce(function(s,t){return s+t.pnlAmount;},0);

    var byCloseDesc = closed.slice().sort(function(a,b){ return new Date(b.closedAt)-new Date(a.closedAt); });
    var streak=0, streakType=null;
    for(var i=0;i<byCloseDesc.length;i++){
      var t = byCloseDesc[i];
      if(t.outcome==='breakeven') break;
      if(streakType===null){ streakType=t.outcome; streak=1; }
      else if(t.outcome===streakType) streak++;
      else break;
    }
    var byCloseAsc = closed.slice().sort(function(a,b){ return new Date(a.closedAt)-new Date(b.closedAt); });
    var equity = accountMeta.startingBalance, peak = equity, maxDD = 0;
    byCloseAsc.forEach(function(t){ equity += t.pnlAmount; peak = Math.max(peak, equity); maxDD = Math.max(maxDD, peak-equity); });

    return { totalActive:active.length, openCount:open.length, closedCount:closed.length,
      winRate:winRate, expectancyR:expectancyR, profitFactor:profitFactor, totalPnl:totalPnl,
      streak:streak, streakType:streakType, maxDD:maxDD, currentBalance:accountMeta.startingBalance+totalPnl };
  }

  /* ---------------- Data layer (Firebase) ---------------- */
  function showConnectionError(msg, offerSignOut){
    var signOutHtml = offerSignOut ? '<button class="btn btn-ghost" id="wrongAccountSignOut" style="margin-top:14px;">Sign out and try another account</button>' : '';
    $('#tradeList').innerHTML = '<div class="db-blocked"><p class="empty-title">'+msg+'</p><p class="empty-body">Reload the page to try again.</p>'+signOutHtml+'</div>';
    $('#ledgerStrip').innerHTML = '';
    $('#newTradeFab').style.display = 'none';
    if(offerSignOut){ document.getElementById('wrongAccountSignOut').addEventListener('click', function(){ signOut(auth); }); }
  }
  function subscribeTrades(){
    onSnapshot(collection(dbFs, 'trades'),
      function(snap){ trades = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); renderAll(); },
      function(err){
        console.error('trades onSnapshot error', err);
        if(err && err.code === 'permission-denied'){ showConnectionError('This Google account isn\'t authorized for this journal.', true); }
        else { showToast('Live sync interrupted — reload to reconnect.', 'error'); }
      }
    );
  }
  function loadAccountMeta(){
    return getDoc(doc(dbFs, 'meta', 'account')).then(function(snap){
      if(snap.exists()){ accountMeta = snap.data(); }
      else { accountMeta = { startingBalance: DEFAULT_STARTING_BALANCE }; return setDoc(doc(dbFs, 'meta', 'account'), accountMeta); }
    });
  }
  function updateStartingBalance(value){
    accountMeta = Object.assign({}, accountMeta, { startingBalance: value });
    return setDoc(doc(dbFs, 'meta', 'account'), accountMeta).then(renderAll);
  }
  function createTrade(data){ return addDoc(collection(dbFs, 'trades'), data); }
  function patchTrade(id, data){ return updateDoc(doc(dbFs, 'trades', id), data); }
  function deleteTradeDoc(id){ return deleteDoc(doc(dbFs, 'trades', id)); }

  function initApp(){
    dbReady = true;
    subscribeTrades();
    loadAccountMeta();
  }

  /* ---------------- Auth gate ---------------- */
  function wireAuthGate(){
    var appRoot = document.getElementById('appRoot');
    var authGate = document.getElementById('authGate');
    var authStatus = document.getElementById('authStatus');
    document.getElementById('signInBtn').addEventListener('click', function(){
      authStatus.textContent = '';
      signInWithPopup(auth, googleProvider).catch(function(err){
        console.error('sign-in error', err);
        authStatus.textContent = 'Sign-in failed — try again.';
      });
    });
    onAuthStateChanged(auth, function(user){
      if(user){
        authGate.style.display = 'none';
        appRoot.style.display = 'flex';
        if(!dbReady) initApp();
      } else {
        authGate.style.display = 'flex';
        appRoot.style.display = 'none';
      }
    });
  }

  /* ---------------- Rendering ---------------- */
  function renderAll(){ renderLedgerStrip(); renderTraderOptions(); renderTradeList(); }

  function metricHtml(label, value, tone){
    return '<div class="metric"><span class="metric-value '+(tone||'')+'">'+value+'</span><span class="metric-label">'+label+'</span></div>';
  }
  function renderLedgerStrip(){
    var s = computeStats();
    var pf = s.profitFactor===null ? '—' : s.profitFactor===Infinity ? '∞' : s.profitFactor.toFixed(2);
    $('#ledgerStrip').innerHTML = [
      metricHtml('Balance', fmtMoney(s.currentBalance)),
      metricHtml('Win rate', s.winRate===null ? '—' : fmtPct(s.winRate)),
      metricHtml('Expectancy', fmtR(s.expectancyR)),
      metricHtml('Total P&amp;L', fmtMoney(s.totalPnl), s.totalPnl>0?'up':s.totalPnl<0?'down':''),
      metricHtml('Streak', s.streak ? s.streak+(s.streakType==='win'?'W':'L') : '—', s.streakType==='win'?'up':s.streakType==='loss'?'down':''),
      metricHtml('Profit factor', pf)
    ].join('');
  }
  function renderTraderOptions(){
    var known = Array.from(new Set(trades.map(function(t){return t.trader;}).filter(Boolean))).sort();
    var sel = $('#filterTrader'); var current = sel.value;
    sel.innerHTML = '<option value="all">Everyone</option>' + known.map(function(t){ return '<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>'; }).join('');
    if(known.indexOf(current)>-1) sel.value = current;
    $('#traderList').innerHTML = known.map(function(t){ return '<option value="'+escapeHtml(t)+'"></option>'; }).join('');
  }
  function getFilteredTrades(){
    var list = trades.slice();
    if(filters.status==='active') list = list.filter(function(t){return !t.archived;});
    else if(filters.status==='archived') list = list.filter(function(t){return t.archived;});
    else if(filters.status==='open') list = list.filter(function(t){return !t.archived && t.status==='open';});
    else if(filters.status==='closed') list = list.filter(function(t){return !t.archived && t.status==='closed';});
    if(filters.trader!=='all') list = list.filter(function(t){return t.trader===filters.trader;});
    if(filters.search){
      var q = filters.search.toLowerCase();
      list = list.filter(function(t){ return [t.pair,t.strategyTag,t.notes].some(function(v){ return (v||'').toLowerCase().indexOf(q)>-1; }); });
    }
    if(filters.sort==='date_asc') list.sort(function(a,b){return new Date(a.createdAt)-new Date(b.createdAt);});
    else if(filters.sort==='pnl_desc') list.sort(function(a,b){return (b.pnlAmount||0)-(a.pnlAmount||0);});
    else if(filters.sort==='pnl_asc') list.sort(function(a,b){return (a.pnlAmount||0)-(b.pnlAmount||0);});
    else list.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
    return list;
  }
  function renderTradeList(){
    if(!dbReady) return;
    var list = getFilteredTrades();
    var container = $('#tradeList');
    if(list.length===0){
      container.innerHTML = '<div class="empty-state"><p class="empty-title">'+(trades.length===0?'No trades logged yet':'No trades match this view')+'</p><p class="empty-body">'+(trades.length===0?'Log your first one to start building your edge.':'Try a different filter or search.')+'</p></div>';
      return;
    }
    container.innerHTML = list.map(renderTradeCard).join('');
  }
  function renderTradeCard(t){
    var seam = t.archived ? 'seam-muted' : t.status==='open' ? 'seam-gold' : t.outcome==='win' ? 'seam-profit' : t.outcome==='loss' ? 'seam-loss' : 'seam-muted';
    var pnlLabel = t.status==='closed' ? (fmtMoney(t.pnlAmount)+' · '+fmtR(t.pnlR)) : 'Open';
    var pnlTone = t.status==='closed' ? (t.pnlAmount>0?'up':t.pnlAmount<0?'down':'') : '';
    var dateLabel = new Date(t.createdAt).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
    return '<article class="trade-card '+seam+'" data-id="'+t.id+'">'+
      '<button class="trade-summary" data-action="toggle" data-id="'+t.id+'">'+
        '<div class="trade-main"><span class="trade-pair">'+escapeHtml(t.pair)+'</span><span class="trade-dir dir-'+t.direction+'">'+(t.direction==='long'?'Long':'Short')+'</span></div>'+
        '<div class="trade-side"><span class="trade-pnl '+pnlTone+'">'+pnlLabel+'</span><span class="trade-meta">'+dateLabel+' · '+escapeHtml(t.trader||'—')+'</span></div>'+
      '</button>'+
      '<div class="trade-detail" hidden>'+renderTradeDetail(t)+'</div>'+
    '</article>';
  }
  function actionBtn(action,id,iconName,label){
    return '<button class="detail-btn" data-action="'+action+'" data-id="'+id+'">'+icon(iconName,15)+'<span>'+label+'</span></button>';
  }
  function renderTradeDetail(t){
    var rows = [
      ['Entry', t.entryPrice], ['Stop-loss', t.stopLoss], ['Take-profit', t.takeProfit!=null?t.takeProfit:'—'],
      ['Position size', t.positionSizeLots ? t.positionSizeLots.toFixed(2)+' lots' : '—'],
      ['Planned R:R', t.rr ? '1 : '+t.rr.toFixed(2) : '—'],
      ['Risk', fmtMoney(t.riskAmount)]
    ];
    if(t.status==='closed') rows.push(['Exit', t.exitPrice], ['Closed', new Date(t.closedAt).toLocaleString()]);
    var html = '<div class="detail-grid">'+rows.map(function(r){ return '<div class="detail-row"><span>'+r[0]+'</span><span class="mono">'+escapeHtml(String(r[1]))+'</span></div>'; }).join('')+'</div>';
    var tags = [t.strategyTag, t.session, t.emotionTag].filter(Boolean);
    if(tags.length) html += '<div class="tag-row">'+tags.map(function(tag){return '<span class="tag">'+escapeHtml(tag)+'</span>';}).join('')+'</div>';
    var mistakes = t.mistakeTags||[];
    if(mistakes.length) html += '<div class="tag-row">'+mistakes.map(function(m){return '<span class="tag tag-warn">'+escapeHtml(m)+'</span>';}).join('')+'</div>';
    if(t.notes) html += '<p class="detail-notes">'+escapeHtml(t.notes)+'</p>';
    if(t.referenceLink) html += '<a class="detail-link" href="'+escapeHtml(t.referenceLink)+'" target="_blank" rel="noopener">View chart reference ↗</a>';
    html += '<div class="detail-actions">';
    if(t.status==='open' && !t.archived) html += actionBtn('close-trade', t.id, 'check', 'Close trade');
    if(t.status==='closed' && !t.archived) html += actionBtn('reopen', t.id, 'undo', 'Reopen');
    html += actionBtn('edit', t.id, 'edit', 'Edit');
    html += t.archived ? actionBtn('restore', t.id, 'undo', 'Restore') : actionBtn('archive', t.id, 'archivei', 'Archive');
    html += actionBtn('delete', t.id, 'trash', 'Delete');
    html += '</div>';
    return html;
  }

  /* ---------------- Toasts ---------------- */
  function showToast(msg, type){
    var el = document.createElement('div');
    el.className = 'toast'+(type==='error'?' error':'');
    el.textContent = msg;
    $('#toastRoot').appendChild(el);
    setTimeout(function(){ el.remove(); }, 3200);
  }

  /* ---------------- Overlay / modal system ---------------- */
  function openOverlay(innerHtml, opts){
    opts = opts||{};
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = '<div class="sheet'+(opts.small?' sheet-small':'')+'">'+innerHtml+'</div>';
    overlay.addEventListener('click', function(e){ if(e.target===overlay) closeOverlay(); });
    document.getElementById('overlayRoot').appendChild(overlay);
    return overlay;
  }
  function closeOverlay(){
    var root = document.getElementById('overlayRoot');
    root.innerHTML = '';
  }

    var overlay = openOverlay(html);

      $all('button', sheet.querySelector('#f_direction_seg')).forEach(function(b){ b.classList.toggle('active', b===btn); });
      recalc();
    });
    sheet.querySelectorAll('#f_emotion_group .chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        $all('.chip', sheet.querySelector('#f_emotion_group')).forEach(function(c){ if(c!==chip) c.classList.remove('active'); });

        entryPrice: num(sheet.querySelector('#f_entry').value),

    function recalc(){
      var f = readForm();
      var c = calcEntry(f);
      var warn = '';
      if(f.entryPrice!=null && f.stopLoss!=null && f.entryPrice===f.stopLoss) warn = 'Stop-loss can\'t equal entry price.';
      sheet.querySelector('#calcPanel').innerHTML =
        '<p class="calc-title">Live position sizing</p>'+
        '<div class="calc-row"><span>Stop distance</span><span>'+(c.slPips!=null?c.slPips.toFixed(1)+' pips':'—')+'</span></div>'+
        '<div class="calc-row"><span>Target distance</span><span>'+(c.tpPips!=null?c.tpPips.toFixed(1)+' pips':'—')+'</span></div>'+
        '<div class="calc-row"><span>Risk : Reward</span><span>'+(c.rr!=null?'1 : '+c.rr.toFixed(2):'—')+'</span></div>'+
        '<div class="calc-row"><span>Risk amount</span><span>'+(c.riskAmount!=null?fmtMoney(c.riskAmount):'—')+'</span></div>'+
        '<div class="calc-row"><span>Suggested size</span><span>'+(c.positionSizeLots!=null?c.positionSizeLots.toFixed(2)+' lots':'—')+'</span></div>'+
        (warn?'<p class="calc-warn">'+warn+'</p>':'');
    }
    recalc();

    sheet.querySelector('#saveTradeBtn').addEventListener('click', function(){
      var f = readForm();
      var trader = sheet.querySelector('#f_trader').value.trim();
      if(!trader || !f.pair || f.entryPrice==null || f.stopLoss==null){
        showToast('Fill in trader, pair, entry and stop-loss to save.', 'error');
        return;
      }
      if(f.entryPrice === f.stopLoss){ showToast('Stop-loss can\'t equal entry price.', 'error'); return; }
      var c = calcEntry(f);
      var emotionEl = sheet.querySelector('#f_emotion_group .chip.active');
      var mistakeEls = $all('#f_mistake_group .chip.active', sheet);
      var payload = {
        trader: trader,
        pair: f.pair, direction: directionVal,
        entryPrice: f.entryPrice, stopLoss: f.stopLoss, takeProfit: f.takeProfit,
        accountBalanceAtEntry: f.accountBalance, riskPercent: f.riskPercent, pipValue: f.pipValue,
        slPips: c.slPips, tpPips: c.tpPips, rr: c.rr, riskAmount: c.riskAmount, positionSizeLots: c.positionSizeLots,
        strategyTag: sheet.querySelector('#f_strategy').value.trim(),
        session: sheet.querySelector('#f_session').value,
        emotionTag: emotionEl ? emotionEl.getAttribute('data-val') : '',
        mistakeTags: mistakeEls.map(function(el){ return el.getAttribute('data-val'); }),
        referenceLink: sheet.querySelector('#f_reflink').value.trim(),
        notes: sheet.querySelector('#f_notes').value.trim(),
        createdAt: toIso(sheet.querySelector('#f_datetime').value),
        updatedAt: new Date().toISOString()
      };
      if(existing){
        if(existing.status==='closed' && existing.exitPrice!=null){
          var recloses = calcClose(Object.assign({}, existing, payload), existing.exitPrice);
          payload.exitPrice = existing.exitPrice; payload.closedAt = existing.closedAt;
          payload.pnlPips = recloses.pnlPips; payload.pnlAmount = recloses.pnlAmount; payload.pnlR = recloses.pnlR; payload.outcome = recloses.outcome;
        }
        patchTrade(existing.id, payload).then(function(){ closeOverlay(); showToast('Trade updated.'); });
      } else {
        payload.status = 'open'; payload.archived = false;
        payload.exitPrice = null; payload.closedAt = null; payload.pnlAmount = null; payload.pnlR = null; payload.pnlPips = null; payload.outcome = null;
        createTrade(payload).then(function(){ closeOverlay(); showToast('Trade saved.'); });
      }
    });
  }
  function isoToLocalInput(iso){
    var d = new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }

  /* ---------------- Close-trade modal ---------------- */
  function openCloseModal(trade){
    var html = ''+
      '<div class="sheet-header"><h2 class="sheet-title">Close trade</h2><button class="sheet-close" data-action="close-sheet">'+icon('x',16)+'</button></div>'+
      '<div class="field"><label>'+escapeHtml(trade.pair)+' · '+(trade.direction==='long'?'Long':'Short')+'</label></div>'+
      '<div class="field"><label>Exit price</label><input type="number" step="any" id="c_exit" placeholder="e.g. '+trade.entryPrice+'"></div>'+
      '<div class="field"><label>Closed at</label><input type="datetime-local" id="c_datetime" value="'+nowLocalInput()+'"></div>'+
      '<div class="calc-panel" id="closeCalcPanel"><p class="calc-title">Preview</p><div class="calc-row"><span>Enter an exit price</span><span>—</span></div></div>'+
      '<button class="btn btn-primary" id="confirmCloseBtn">Close trade</button>';
    var overlay = openOverlay(html, {small:true});
    var sheet = overlay.querySelector('.sheet');
    overlay.addEventListener('click', function(e){ if(e.target.closest('[data-action="close-sheet"]')) closeOverlay(); });
    sheet.querySelector('#c_exit').addEventListener('input', function(){
      var ex = num(this.value);
      if(ex==null){ sheet.querySelector('#closeCalcPanel').innerHTML = '<p class="calc-title">Preview</p><div class="calc-row"><span>Enter an exit price</span><span>—</span></div>'; return; }
      var r = calcClose(trade, ex);
      sheet.querySelector('#closeCalcPanel').innerHTML = '<p class="calc-title">Preview</p>'+
        '<div class="calc-row"><span>P&amp;L</span><span class="'+(r.pnlAmount>0?'up':r.pnlAmount<0?'down':'')+'" style="color:'+(r.pnlAmount>0?'var(--profit)':r.pnlAmount<0?'var(--loss)':'inherit')+'">'+fmtMoney(r.pnlAmount)+'</span></div>'+
        '<div class="calc-row"><span>R-multiple</span><span>'+fmtR(r.pnlR)+'</span></div>'+
        '<div class="calc-row"><span>Outcome</span><span>'+r.outcome+'</span></div>';
    });
    sheet.querySelector('#confirmCloseBtn').addEventListener('click', function(){
      var ex = num(sheet.querySelector('#c_exit').value);
      if(ex==null){ showToast('Enter an exit price.', 'error'); return; }
      var r = calcClose(trade, ex);
      patchTrade(trade.id, {
        status:'closed', exitPrice:ex, closedAt: toIso(sheet.querySelector('#c_datetime').value),
        pnlPips:r.pnlPips, pnlAmount:r.pnlAmount, pnlR:r.pnlR, outcome:r.outcome
      }).then(function(){ closeOverlay(); showToast('Trade closed — '+fmtMoney(r.pnlAmount)+' logged.'); });
    });
  }

  /* ---------------- Confirm delete ---------------- */
  function openConfirmDelete(trade){
    var html = ''+
      '<div class="sheet-header"><h2 class="sheet-title">Delete trade?</h2><button class="sheet-close" data-action="close-sheet">'+icon('x',16)+'</button></div>'+
      '<p class="empty-body" style="margin-bottom:18px;">This removes '+escapeHtml(trade.pair)+' from '+new Date(trade.createdAt).toLocaleDateString()+' for good. This can\'t be undone — archive instead if you want to keep the record.</p>'+
      '<div class="btn-row"><button class="btn btn-ghost" data-action="close-sheet">Cancel</button><button class="btn btn-danger" id="confirmDeleteBtn">Delete</button></div>';
    var overlay = openOverlay(html, {small:true});
    overlay.addEventListener('click', function(e){ if(e.target.closest('[data-action="close-sheet"]')) closeOverlay(); });
    overlay.querySelector('#confirmDeleteBtn').addEventListener('click', function(){
      deleteTradeDoc(trade.id).then(function(){ closeOverlay(); showToast('Trade deleted.'); });
    });
  }

  /* ---------------- Settings sheet (starting balance) ---------------- */
  function openSettings(){
    var currentEmail = (auth.currentUser && auth.currentUser.email) || 'unknown';
    var html = ''+
      '<div class="sheet-header"><h2 class="sheet-title">Settings</h2><button class="sheet-close" data-action="close-sheet">'+icon('x',16)+'</button></div>'+
      '<div class="field"><label>Signed in as</label><p class="mono" style="font-size:13px; margin:0;">'+escapeHtml(currentEmail)+'</p></div>'+
      '<div class="field"><label>Starting balance</label><input type="number" step="any" id="s_balance" value="'+accountMeta.startingBalance+'"><span class="field-hint">Current balance is calculated automatically from starting balance + closed P&amp;L.</span></div>'+
      '<button class="btn btn-primary" id="saveSettingsBtn">Save</button>'+
      '<button class="btn btn-ghost" id="signOutBtn" style="margin-top:10px;">Sign out</button>';
    var overlay = openOverlay(html, {small:true});
    overlay.addEventListener('click', function(e){ if(e.target.closest('[data-action="close-sheet"]')) closeOverlay(); });
    overlay.querySelector('#saveSettingsBtn').addEventListener('click', function(){
      var v = num(overlay.querySelector('#s_balance').value);
      if(v==null){ showToast('Enter a valid number.', 'error'); return; }
      updateStartingBalance(v).then(function(){ closeOverlay(); showToast('Starting balance updated.'); });
    });
    overlay.querySelector('#signOutBtn').addEventListener('click', function(){ signOut(auth); closeOverlay(); });
  }

  /* ---------------- CSV helpers ---------------- */
  var CSV_FIELDS = ['id','trader','pair','direction','entryPrice','stopLoss','takeProfit','accountBalanceAtEntry','riskPercent','pipValue','slPips','tpPips','rr','riskAmount','positionSizeLots','status','archived','exitPrice','pnlPips','pnlAmount','pnlR','outcome','strategyTag','session','emotionTag','mistakeTags','referenceLink','notes','createdAt','updatedAt','closedAt'];
  function csvEscape(v){
    if(v===null||v===undefined) return '';
    var s = Array.isArray(v) ? v.join('|') : String(v);
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function tradesToCsv(list){
    var lines = [CSV_FIELDS.join(',')];
    list.forEach(function(t){ lines.push(CSV_FIELDS.map(function(f){ return csvEscape(t[f]); }).join(',')); });
    return lines.join('\n');
  }
  function parseCsvLine(line){
    var out = []; var cur=''; var inQ=false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(inQ){
        if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
        else cur+=c;
      } else {
        if(c==='"') inQ=true;
        else if(c===','){ out.push(cur); cur=''; }
        else cur+=c;
      }
    }
    out.push(cur);
    return out;
  }
  function csvToTrades(text){
    var rows = text.replace(/\r\n/g,'\n').split('\n').filter(function(l){return l.length>0;});
    if(rows.length<2) return [];
    var headers = parseCsvLine(rows[0]);
    var numFields = ['entryPrice','stopLoss','takeProfit','accountBalanceAtEntry','riskPercent','pipValue','slPips','tpPips','rr','riskAmount','positionSizeLots','exitPrice','pnlPips','pnlAmount','pnlR'];
    return rows.slice(1).map(function(row){
      var cells = parseCsvLine(row);
      var obj = {};
      headers.forEach(function(h, idx){
        var raw = cells[idx];
        if(raw==='' || raw===undefined){ obj[h] = null; return; }
        if(h==='mistakeTags'){ obj[h] = raw ? raw.split('|') : []; }
        else if(h==='archived'){ obj[h] = raw==='true'; }
        else if(numFields.indexOf(h)>-1){ obj[h] = num(raw); }
        else obj[h] = raw;
      });
      delete obj.id;
      return obj;
    });
  }

  /* ---------------- Export / Import ---------------- */
  function downloadBlob(filename, data, mime){
    var blob = new Blob([data], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function doExport(kind){
    var data, filename, mime;
    if(kind==='csv'){ data = tradesToCsv(trades); filename = 'kaizen-trades.csv'; mime = 'text/csv'; }
    else { data = JSON.stringify(trades, null, 2); filename = 'kaizen-trades.json'; mime = 'application/json'; }
    downloadBlob(filename, data, mime);
    showToast('Downloaded '+filename+'.');
  }
  function openExportMenu(){
    var html = ''+
      '<div class="sheet-header"><h2 class="sheet-title">Export trades</h2><button class="sheet-close" data-action="close-sheet">'+icon('x',16)+'</button></div>'+
      '<button class="btn btn-ghost" id="expCsv" style="margin-bottom:10px;">Export as CSV</button>'+
      '<button class="btn btn-ghost" id="expJson">Export as JSON</button>';
    var overlay = openOverlay(html, {small:true});
    overlay.addEventListener('click', function(e){ if(e.target.closest('[data-action="close-sheet"]')) closeOverlay(); });
    overlay.querySelector('#expCsv').addEventListener('click', function(){ doExport('csv'); closeOverlay(); });
    overlay.querySelector('#expJson').addEventListener('click', function(){ doExport('json'); closeOverlay(); });
  }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var text = reader.result;
        var rows = /\.json$/i.test(file.name) ? JSON.parse(text) : csvToTrades(text);
        if(!Array.isArray(rows) || rows.length===0){ showToast('No trades found in that file.', 'error'); return; }
        var chain = Promise.resolve();
        rows.forEach(function(r){
          chain = chain.then(function(){
            var clean = Object.assign({}, r); delete clean.id;
            return createTrade(clean);
          });
        });
        chain.then(function(){ showToast('Imported '+rows.length+' trade'+(rows.length===1?'':'s')+'.'); })
             .catch(function(){ showToast('Import finished with some errors.', 'error'); });
      } catch(e){ showToast('Couldn\'t read that file.', 'error'); }
    };
    reader.readAsText(file);
  }

  /* ---------------- Event wiring ---------------- */
  document.getElementById('newTradeFab').addEventListener('click', function(){ openTradeForm(null); });
  document.getElementById('exportBtn').addEventListener('click', openExportMenu);
  document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFileInput').click(); });
  document.getElementById('importFileInput').addEventListener('change', function(e){
    var file = e.target.files[0]; if(file) handleImportFile(file); e.target.value='';
  });
  document.getElementById('searchInput').addEventListener('input', function(){ filters.search = this.value; renderTradeList(); });
  document.getElementById('filterStatus').addEventListener('change', function(){ filters.status = this.value; renderTradeList(); });
  document.getElementById('filterTrader').addEventListener('change', function(){ filters.trader = this.value; renderTradeList(); });
  document.getElementById('sortBy').addEventListener('change', function(){ filters.sort = this.value; renderTradeList(); });

  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      var tab = btn.getAttribute('data-tab');
      if(tab==='journal'){ return; }
      if(tab==='settings'){ openSettings(); return; }
      showToast('Coming soon — '+btn.textContent.trim()+' is next on the roadmap.');
    });
  });

  document.getElementById('tradeList').addEventListener('click', function(e){
    var actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    var id = actionEl.getAttribute('data-id');
    var trade = trades.find(function(t){ return t.id===id; });
    if(action==='toggle'){
      var card = actionEl.closest('.trade-card');
      var detail = card.querySelector('.trade-detail');
      detail.hidden = !detail.hidden;
      return;
    }
    if(!trade) return;
    if(action==='edit') openTradeForm(trade);
    else if(action==='close-trade') openCloseModal(trade);
    else if(action==='reopen') patchTrade(id, {status:'open', exitPrice:null, closedAt:null, pnlAmount:null, pnlR:null, pnlPips:null, outcome:null}).then(function(){ showToast('Trade reopened.'); });
    else if(action==='archive') patchTrade(id, {archived:true}).then(function(){ showToast('Trade archived.'); });
    else if(action==='restore') patchTrade(id, {archived:false}).then(function(){ showToast('Trade restored.'); });
    else if(action==='delete') openConfirmDelete(trade);
  });

  wireAuthGate();
})();
</script>
